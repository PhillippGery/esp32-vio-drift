; =============================================================================
; NODES 3–5 — Shared IMU Firmware (identical hardware to Node 2)
; Hardware: Adafruit ESP32 Feather V2 + MPU-6050 IMU
; Framework: Arduino (PlatformIO)
;
; To flash a specific node, override NODE_ID at the CLI:
;   pio run -e node3 --target upload
;   pio run -e node4 --target upload
;   pio run -e node5 --target upload
; =============================================================================

[common_imu]
platform  = espressif32
board     = adafruit_feather_esp32v2
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_deps =
    electroniccats/MPU6050 @ ^1.3.0
    bblanchon/ArduinoJson @ ^7.1.0
build_flags =
    -DNODE_TYPE_IMU
    -DCORE_DEBUG_LEVEL=0
    -DIMU_I2C_SDA=22
    -DIMU_I2C_SCL=20
board_build.partitions = default.csv

; --------------------
[env:node3]
extends    = common_imu
build_flags =
    ${common_imu.build_flags}
    -DNODE_ID=3

; --------------------
[env:node4]
extends    = common_imu
build_flags =
    ${common_imu.build_flags}
    -DNODE_ID=4

; --------------------
[env:node5]
extends    = common_imu
build_flags =
    ${common_imu.build_flags}
    -DNODE_ID=5
