; =============================================================================
; NODE 2 — IMU Reference Node
; Hardware: Adafruit ESP32 Feather V2 + MPU-6050 IMU
; Framework: Arduino (PlatformIO)
; =============================================================================

[env:node2_imu]
platform  = espressif32
board     = adafruit_feather_esp32_v2
framework = arduino

; Serial monitor
monitor_speed = 115200
upload_speed  = 921600

; Build flags
build_flags =
    -DNODE_ID=2
    -DNODE_TYPE_IMU
    -DCORE_DEBUG_LEVEL=0
    ; I2C pins (ESP32 Feather V2 defaults)
    -DIMU_I2C_SDA=22
    -DIMU_I2C_SCL=20
    -D WE_USE_FLOAT

; Library dependencies
lib_deps =
    ; JSON serialization
    bblanchon/ArduinoJson @ ^7.1.0
    adafruit/Adafruit NeoPixel @ ^1.12.0

; Partition scheme
board_build.partitions = default.csv
