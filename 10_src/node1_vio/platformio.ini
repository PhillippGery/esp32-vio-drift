; =============================================================================
; NODE 1 — VIO Node
; Hardware: Adafruit ESP32 Feather V2 + MPU-6050 IMU + ArduCAM Mini SPI
; Framework: Arduino (PlatformIO)
; =============================================================================

[env:node1_vio]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

; Enable PSRAM (the Sense board has 8 MB octal PSRAM)
build_flags =
    -DNODE_ID=1
    -DNODE_TYPE_VIO
    -DCORE_DEBUG_LEVEL=4
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1
    -DCONFIG_SPIRAM=1
    -DCAMERA_MODEL_XIAO_ESP32S3
    -D WE_USE_FLOAT


upload_speed = 460800
; Library dependencies
lib_deps =
    ; MPU-6050 / IMU
    electroniccats/MPU6050 @ ^1.3.0
    bblanchon/ArduinoJson @ ^6.21.3
    tomstewart89/BasicLinearAlgebra @ ^5.1
    ; WiFi (built-in ESP32 Arduino)
    ; JSON serialization
    bblanchon/ArduinoJson @ ^7.1.0
    adafruit/Adafruit NeoPixel @ ^1.12.0


; Filesystem
board_build.filesystem = spiffs

; Partition scheme with OTA support
board_build.partitions = min_spiffs.csv

; Extra scripts (optional — e.g. for pre-build version injection)
; extra_scripts = pre:scripts/version_inject.py
monitor_speed = 115200