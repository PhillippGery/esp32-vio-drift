; =============================================================================
; NODE 1 — VIO Node
; Hardware: Adafruit ESP32 Feather V2 + MPU-6050 IMU + ArduCAM Mini SPI
; Framework: Arduino (PlatformIO)
; =============================================================================

[env:node1_vio]
platform  = espressif32
board     = adafruit_feather_esp32v2
framework = arduino

; Serial monitor
monitor_speed = 115200
upload_speed  = 921600

; Build flags
build_flags =
    -DNODE_ID=1
    -DNODE_TYPE_VIO
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    ; SPI / ArduCAM settings
    -DARDUCAM_SHIELD_V2
    -DOV2640_MINI_2MP_PLUS
    ; I2C pins (ESP32 Feather V2 defaults)
    -DIMU_I2C_SDA=22
    -DIMU_I2C_SCL=20
    ; SPI pins for ArduCAM
    -DCAM_SPI_CS=33
    -DCAM_SPI_MOSI=18
    -DCAM_SPI_MISO=19
    -DCAM_SPI_SCK=5

; Library dependencies
lib_deps =
    ; MPU-6050 / IMU
    electroniccats/MPU6050 @ ^1.3.0
    ; ArduCAM
    arducam/ArduCAM @ ^1.0.6
    ; ArduCAM requires I2C from Wire (built-in)
    ; WiFi (built-in ESP32 Arduino)
    ; JSON serialization
    bblanchon/ArduinoJson @ ^7.1.0
    ; Kalman filter helpers (header-only)
    rfetick/RPi-Pico-Kalman @ ^0.1.0

; Filesystem
board_build.filesystem = spiffs

; Partition scheme with OTA support
board_build.partitions = min_spiffs.csv

; Extra scripts (optional — e.g. for pre-build version injection)
; extra_scripts = pre:scripts/version_inject.py
