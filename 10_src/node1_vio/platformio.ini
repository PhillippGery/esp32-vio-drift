; ============================================================
; PROJECT DRIFT — Node 1: XIAO ESP32S3 Sense (Camera + VIO)
; ============================================================
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Enable PSRAM (the Sense board has 8 MB octal PSRAM)
build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1
    -DCONFIG_SPIRAM=1
    -DCAMERA_MODEL_XIAO_ESP32S3
    -DCORE_DEBUG_LEVEL=4

; Monitor speed
monitor_speed = 115200
upload_speed = 921600

; Partition scheme — use huge_app to get enough flash for camera + VIO + (later) TFLite
board_build.partitions = huge_app.csv

lib_deps =
    ; ESP32 camera driver is built into the framework, no extra lib needed